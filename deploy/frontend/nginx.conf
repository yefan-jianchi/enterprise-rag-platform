# ============================================================================
#  前端静态站 Nginx 配置（容器内部）
#  Vue Router 用 history 模式，所以必须有 try_files 回退到 index.html，
#  否则用户刷新 /chat 这种子路由会 404。
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
