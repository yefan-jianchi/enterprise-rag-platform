# ============================================================================
#  Nginx 统一入口（反向代理）
#  路由规则：
#     /api/    → 后端 Spring Boot:8080   （业务接口，含 SSE 流式）
#     /ai/     → AI 服务 Python:8001     （检索/解析直连，便于调试）
#     /        → 前端 Vue3 静态站:80
#
#  ⚠ SSE 流式的三个关键配置（少一个前端就会「一直在转圈，最后一次性出结果」）：
#      proxy_buffering off;        关闭缓冲，让每个 chunk 立刻下发
#      proxy_cache off;            关闭缓存
#      proxy_read_timeout 300s;    长连接读超时拉长，否则 60s 就断
# ============================================================================

upstream rag_backend {
    server backend:8080;
    keepalive 32;
}

upstream rag_ai {
    server ai-service:8001;
    keepalive 16;
}

upstream rag_frontend {
    server frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传文档可能比较大
    client_max_body_size 64m;
    client_body_timeout 120s;

    charset utf-8;
    access_log /var/log/nginx/rag.access.log;
    error_log  /var/log/nginx/rag.error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ------------------------------ 后端业务接口 ------------------------------
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式输出必需
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------ AI 服务（调试用） ------------------------------
    location /ai/ {
        proxy_pass http://rag_ai/;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Connection      "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ------------------------------ 前端 ------------------------------
    location / {
        proxy_pass http://rag_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header Connection "";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
